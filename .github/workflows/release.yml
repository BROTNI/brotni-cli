name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: true

      - name: Test
        run: go test ./... -race

      - name: Cross-compile binaries
        run: make cross

      - name: Generate checksums
        working-directory: dist
        run: sha256sum brotni-* > checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/brotni-*
            dist/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
